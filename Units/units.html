<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        .container {
            width: 400px;
            height: 550px;
            margin: 0 auto;
            border-radius: 20px;
            border: 2px solid #000;
            background-color: snow;
        }

        .child {
            width: 100%;
            height: 30%;
            background-color: rgb(10, 186, 245);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        div>img {
            width: 250px;
            height: 250px;
            margin: 5px 70px;
            position: relative;
        }

        .icon {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            top: 27%;
            left: 53%;
            background-color: rgb(3, 85, 26);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: icon 2s ease-in-out infinite;
        }

        @keyframes icon {
            0% {
                background-color: rgb(2, 142, 42);
            }

            50% {
                background-color: rgb(2, 187, 55);
            }

            100% {
                background-color: rgb(6, 239, 72);
            }
        }

        .icon i {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info {
            text-align: center;
            margin-top: 80px;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .icons i {
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        .icons i:hover {
            transform: scale(1.2);
        }

        .btn {
            border-radius: 30px;
            background-color: rgb(10, 186, 245);
            border: none;
            color: white;
            padding: 10px 30px;
            font-size: 18px;
            margin-top: 25px;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-5px);
            background-color: rgb(2, 187, 55);
        }

        .social {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 20px;
            margin-top: 20px;
            margin-left: 55px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line {
            width: 1px;
            height: 30px;
            background: #999;
        }

        .heart i {
            color: rgb(192, 33, 33);
            animation: heart 2s ease-in-out infinite;
        }

        @keyframes heart {
            0% {
                color: rgb(153, 3, 3);
            }

            50% {
                color: rgb(204, 3, 3);
            }

            100% {
                color: rgb(251, 7, 7);
            }
        }

        .comment i {
            color: rgb(60, 33, 192);
            animation: comment 2s ease-in-out infinite;
        }

        @keyframes comment {
            0% {
                color: rgb(26, 3, 142);
            }

            50% {
                color: rgb(36, 5, 190);
            }

            100% {
                color: rgb(47, 6, 249);
            }
        }

        .share i {
            color: rgb(3, 85, 26);
            animation: share 2s ease-in-out infinite;
        }

        @keyframes share {
            0% {
                color: rgb(2, 142, 42);
            }

            50% {
                color: rgb(2, 187, 55);
            }

            100% {
                color: rgb(6, 239, 72);
            }
        }

        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid lightblue;
            border-right-color: orange;
            animation: loading 1s infinite linear;
        }

        @keyframes loading {
            to {
                transform: rotate(1turn)
            }
        }
       
    </style>
</head>

<body>
    <div class="container">
        <div class="child">
            <img src="profile.png" alt="profile_image">
            <div class="icon"><i class="fa-solid fa-check"></i></div>
        </div>
        <div class="info">
            <h2>CodingLab</h2>
            <p>YouTuber & Blogger</p>
            <div class="icons" style="margin-top: 25px;">
                <i class="fa-brands fa-facebook  fa-2xl" style="color: rgb(15, 93, 231);"></i>
                <i class="fa-brands fa-square-twitter fa-2xl" style="color: rgb(58, 159, 239);"></i>
                <i class="fa-brands fa-square-instagram fa-2xl" style="color: rgb(244, 13, 40);"></i>
                <i class="fa-brands fa-square-youtube fa-2xl" style="color: rgb(244, 13, 40);"></i>
            </div>

            <div>
                <button class="btn">Subscribe</button>
                <button class="btn">Message</button>

            </div>
            <div class="social">
                <div class="item heart">
                    <i class="fa-solid fa-heart"></i>
                    <span>60.2k</span>
                </div>

                <div class="line"></div>

                <div class="item comment">
                    <i class="fa-solid fa-comment"></i>
                    <span>10k</span>
                </div>

                <div class="line"></div>

                <div class="item share">
                    <i class="fa-solid fa-share"></i>
                    <span>5.5k</span>
                </div>
            </div>
        </div>
        <div class="loader"></div>
    </div>
</body>

</html>
